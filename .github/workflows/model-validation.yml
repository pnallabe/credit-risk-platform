name: Model Validation

on:
  schedule:
    - cron: "0 2 * * 1"   # Every Monday at 02:00 UTC
  workflow_dispatch:
    inputs:
      sample_size:
        description: Training sample size
        required: false
        default: "10000"

env:
  PYTHON_VERSION: "3.11"

jobs:
  validate_models:
    name: Train & validate all models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-models-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install shap lime mlflow

      - name: Generate training data
        run: |
          python data/generate_synthetic_data.py \
            --rows ${{ github.event.inputs.sample_size || 10000 }} \
            --output data/validation_sample.parquet || \
          python data/generate_synthetic_data.py

      - name: Train fraud-detection model
        id: fraud
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'sqlite:///./mlflow/mlruns.db' }}
        run: |
          python -m models.fraud_detection.train \
            --data data/validation_sample.parquet \
            --output models/fraud_detection/fraud_model.pkl \
            --mlflow-experiment fraud_detection_ci \
            2>&1 | tee fraud_train.log
          # Extract metrics written by the training script
          FRAUD_AUC=$(grep "roc_auc" fraud_train.log | tail -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "fraud_auc=${FRAUD_AUC}" >> $GITHUB_OUTPUT

      - name: Train credit-risk model
        id: risk
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'sqlite:///./mlflow/mlruns.db' }}
        run: |
          python -m models.credit_risk.train \
            --data data/validation_sample.parquet \
            --output models/credit_risk/risk_model.pkl \
            --mlflow-experiment credit_risk_ci \
            2>&1 | tee risk_train.log
          RISK_AUC=$(grep "roc_auc" risk_train.log | tail -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          RISK_KS=$(grep "ks_stat" risk_train.log | tail -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "risk_auc=${RISK_AUC}" >> $GITHUB_OUTPUT
          echo "risk_ks=${RISK_KS}" >> $GITHUB_OUTPUT

      - name: Assert quality gates
        run: |
          python - <<'EOF'
          import sys

          def check(name, value_str, threshold, op=">="):
              if not value_str:
                  print(f"WARNING: could not parse {name} metric — skipping gate")
                  return
              v = float(value_str)
              ok = v >= threshold if op == ">=" else v > threshold
              status = "PASS" if ok else "FAIL"
              print(f"[{status}] {name}: {v:.4f} (threshold {op} {threshold})")
              if not ok:
                  sys.exit(1)

          import os
          check("fraud AUC",  os.environ.get("FRAUD_AUC", ""),  0.75)
          check("risk AUC",   os.environ.get("RISK_AUC",  ""),  0.75)
          check("risk KS",    os.environ.get("RISK_KS",   ""),  0.35)
          EOF
        env:
          FRAUD_AUC: ${{ steps.fraud.outputs.fraud_auc }}
          RISK_AUC: ${{ steps.risk.outputs.risk_auc }}
          RISK_KS: ${{ steps.risk.outputs.risk_ks }}

      - name: Register models in MLflow
        if: success()
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'sqlite:///./mlflow/mlruns.db' }}
          RISK_AUC: ${{ steps.risk.outputs.risk_auc }}
          RISK_KS: ${{ steps.risk.outputs.risk_ks }}
        run: |
          python - <<'EOF'
          import sys, os
          sys.path.insert(0, ".")
          from mlflow_config.mlflow_config import configure_mlflow, ModelRegistry
          configure_mlflow()
          reg = ModelRegistry()
          metrics = {
              "roc_auc": float(os.environ.get("RISK_AUC") or 0),
              "ks_stat":  float(os.environ.get("RISK_KS")  or 0),
          }
          try:
              ver = reg.register_model(
                  "credit_risk",
                  "models/credit_risk/risk_model.pkl",
                  metrics,
                  {},
                  "credit_risk_ci",
                  {"ci_run_id": os.environ.get("GITHUB_RUN_ID", "")},
              )
              print(f"Registered credit_risk version {ver}")
          except Exception as exc:
              print(f"MLflow registration skipped: {exc}")
          EOF

      - name: Post summary to pull request (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = [
              '## Model Validation Results',
              '',
              '| Model | AUC | KS |',
              '|-------|-----|----|',
              `| Fraud Detection | ${{ steps.fraud.outputs.fraud_auc || 'N/A' }} | — |`,
              `| Credit Risk | ${{ steps.risk.outputs.risk_auc || 'N/A' }} | ${{ steps.risk.outputs.risk_ks || 'N/A' }} |`,
              '',
              '_Quality gates: AUC ≥ 0.75, KS ≥ 0.35_',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
