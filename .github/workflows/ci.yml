name: CI — Lint, Test, Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}

      - name: Install linters
        run: pip install ruff black

      - name: Run ruff
        run: ruff check . --ignore=E501,E402 --exclude=.venv,node_modules || true

      - name: Run black check
        run: black --check . --exclude=".venv|node_modules" || true

  # ---------------------------------------------------------------------------
  # Test
  # ---------------------------------------------------------------------------
  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install shap lime "python-jose[cryptography]" aiofiles \
                      python-multipart pytest-asyncio aiosqlite pytest-cov

      - name: Run tests with coverage
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET: "test-secret"  # pragma: allowlist secret
        run: |
          pytest \
            feature_pipeline/tests/ \
            decision_engine/tests/ \
            models/pricing/tests/ \
            explainability/tests/ \
            audit/tests/ \
            monitoring/tests/ \
            mlflow_config/tests/ \
            decision-api/tests/ \
            -v --tb=short \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-omit=".venv/*,*/tests/*,*/migrations/*" \
            -p no:warnings \
            --ignore=.venv

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Build Docker images
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ingestion-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ingestion-api/deployment/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ingestion-api:latest
            ghcr.io/${{ github.repository }}/ingestion-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push decision-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: decision-api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/decision-api:latest
            ghcr.io/${{ github.repository }}/decision-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
