# =============================================================================
# Credit Risk Platform — Google Cloud Build
# Builds & deploys all backend services to Cloud Run
#
# Services deployed:
#   ingestion-api   :8080  → crp-ingestion-api
#   decision-api    :8081  → crp-decision-api
#   ai-agent        :8082  → crp-ai-agent
#
# Trigger manually:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_ENVIRONMENT=dev,_REGION=us-central1
#
# Or wired to a Cloud Build trigger on main branch.
# =============================================================================

steps:
  # ── 1. ingestion-api ─────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-ingestion'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/ingestion-api:${_IMAGE_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/ingestion-api:latest'
      - '-f'
      - 'ingestion-api/deployment/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-ingestion'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/ingestion-api']
    waitFor: ['build-ingestion']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-ingestion'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'crp-ingestion-api-${_ENVIRONMENT}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/ingestion-api:${_IMAGE_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--set-secrets=JWT_SECRET=crp-jwt-secret:latest,POSTGRES_PASSWORD=crp-db-password:latest'
      - '--set-env-vars=DATABASE_URL=postgresql+asyncpg://${_DB_USER}:$(crp-db-password)@${_DB_HOST}:5432/${_DB_NAME},ENVIRONMENT=${_ENVIRONMENT}'
      - '--service-account=crp-ingestion-api@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--port=8080'
      - '--labels=environment=${_ENVIRONMENT},component=ingestion,platform=crp'
    waitFor: ['push-ingestion']

  # ── 2. decision-api ───────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-decision'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/decision-api:${_IMAGE_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/decision-api:latest'
      - '-f'
      - 'decision-api/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-decision'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/decision-api']
    waitFor: ['build-decision']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-decision'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'crp-decision-api-${_ENVIRONMENT}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/decision-api:${_IMAGE_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--set-secrets=JWT_SECRET=crp-jwt-secret:latest'
      - '--set-env-vars=MLFLOW_TRACKING_URI=${_MLFLOW_URI},ENVIRONMENT=${_ENVIRONMENT}'
      - '--service-account=crp-decision-api@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=1'
      - '--max-instances=20'
      - '--concurrency=40'
      - '--port=8081'
      - '--labels=environment=${_ENVIRONMENT},component=decision,platform=crp'
    waitFor: ['push-decision']

  # ── 3. ai-agent ───────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-ai-agent'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/ai-agent:${_IMAGE_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/ai-agent:latest'
      - '-f'
      - 'ai-agent/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-ai-agent'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/ai-agent']
    waitFor: ['build-ai-agent']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-ai-agent'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'crp-ai-agent-${_ENVIRONMENT}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/ai-agent:${_IMAGE_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--set-secrets=JWT_SECRET=crp-jwt-secret:latest,OPENAI_API_KEY=crp-openai-key:latest'
      - '--set-env-vars=DECISION_API_URL=https://crp-decision-api-${_ENVIRONMENT}-${_RUN_SUFFIX}.a.run.app,ENVIRONMENT=${_ENVIRONMENT}'
      - '--service-account=crp-ai-agent@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--concurrency=20'
      - '--port=8082'
      - '--labels=environment=${_ENVIRONMENT},component=ai-agent,platform=crp'
    waitFor: ['push-ai-agent']

# ── Substitutions ─────────────────────────────────────────────────────────────
substitutions:
  _REGION: us-central1
  _REPO_NAME: crp-platform
  _ENVIRONMENT: dev
  _IMAGE_TAG: ${SHORT_SHA}
  _DB_USER: crp_user
  _DB_NAME: credit_risk
  _DB_HOST: 127.0.0.1             # Cloud SQL proxy sidecar IP
  _MLFLOW_URI: https://crp-mlflow-dev.a.run.app
  _RUN_SUFFIX: uc.r                # suffix used in Cloud Run URLs

# ── Options ───────────────────────────────────────────────────────────────────
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  substitutionOption: 'ALLOW_LOOSE'

timeout: '2400s'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/ingestion-api:${_IMAGE_TAG}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/decision-api:${_IMAGE_TAG}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/ai-agent:${_IMAGE_TAG}'
