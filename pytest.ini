[pytest]
asyncio_mode = auto
pythonpath = .
testpaths =
    feature_pipeline/tests
    decision_engine/tests
    models/pricing/tests
    explainability/tests
    audit/tests
    monitoring/tests
    mlflow_config/tests
    decision-api/tests
    scripts/tests
    reporting/tests
    orchestration/tests
addopts = -v --tb=short -p no:warnings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
