[pytest]
asyncio_mode = auto
pythonpath = .
addopts = --import-mode=importlib -v --tb=short -p no:warnings
           --cov=agents --cov=decision_engine --cov=compliance
           --cov=monitoring --cov=reporting --cov=risk_models
           --cov=explainability --cov=models
           --cov-report=term-missing --cov-fail-under=80
           --no-cov-on-fail
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    integration: Cross-service integration tests requiring full app import (PROMPT-06)
