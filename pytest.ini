[pytest]
asyncio_mode = auto
pythonpath = .
addopts = --import-mode=importlib -v --tb=short -p no:warnings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    integration: Cross-service integration tests requiring full app import (PROMPT-06)
